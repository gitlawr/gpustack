# Declarative, read-only cache-provider catalog. Loaded by
# gpustack/server/cache_provider_catalog.py and served via
# GET /v2/cache-providers. Providers are shipped with GPUStack releases
# and are not user-editable resources.
#
# Template placeholders available in run_command / run_args / env /
# injection:
#   {{host}}         bind or connect address
#   {{port}}         cache server port
#   {{metrics_port}} Prometheus metrics port (managed mode)
#   {{ram_size}}     cache capacity in GiB (service config)
#   {{chunk_size}}   tokens per KV chunk (service or deployment config)
# A provider's `managed_fields` add {{<name>}} placeholders carrying
# UI-configured values (falling back to declared defaults); a flag whose
# placeholder renders empty is dropped together with the flag.
# Env entries whose rendered value is empty are dropped.
# A version launches its image one of two ways. run_command is the whole
# argument vector and takes the image's ENTRYPOINT slot, so it names the
# executable too — for images whose entrypoint is something else (e.g. an
# engine server). run_args keeps the image's own entrypoint and is
# appended to it as arguments — for images that start the cache server
# themselves, including ones doing setup around it. The two are
# alternatives; the L2 adapter flags and user parameters join whichever
# vector is declared, or stand alone when neither is.
#
# A version entry inherits default_run_command / default_run_args /
# default_image / default_runtime_images from its provider, so a release
# line with a uniform tag layout declares each version as a bare key.
# The launch pair and the image layout are each inherited as a unit: a
# version declaring one field of a pair owns that pair. {{version}} in
# the image templates renders the version key — optional, for providers
# whose tags embed it. The defaults are folded into every version at
# load, so consumers read one effective image and launch off the version
# config.
- name: LMCache
  display_name: LMCache
  source: built_in
  icon: /static/catalog_icons/lmcache.png
  description: >-
    LMCache is a KV cache layer for LLM serving. As a shared cache service it
    runs a cache server on every worker; deployments and replicas on the same
    node share KV cache through it, and a shared L2 storage backend extends
    the reuse across nodes.
  links:
    - { label: Documentation, url: "https://docs.lmcache.ai" }
    - { label: GitHub, url: "https://github.com/LMCache/LMCache" }
  # Managed only: LMCache is the out-of-box single-container engine
  # GPUStack runs itself. Its distributed form (operator + coordinator +
  # per-node servers) is a self-deployed fleet that overlaps this managed
  # per_node topology; genuinely reference-only distributed caches (e.g.
  # Mooncake) are what external mode is for.
  supported_modes: [managed]
  # The MP server keeps KV transfers node-local: every worker runs its
  # own cache server instance and engines attach to the one on their
  # node, so managed deployments follow the cluster's workers.
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  default_version: "v0.5.4"
  # A service may pin a user-supplied image ("custom" version); it runs
  # with the default version's run command and env templates, so the image
  # must be command-compatible.
  custom_version: true
  default_image: "lmcache/vllm-openai:{{version}}"
  default_runtime_images:
    cuda:
      "13": "lmcache/vllm-openai:{{version}}"
      "12": "lmcache/vllm-openai:{{version}}-cu129"
  # Declared versions, each built from the layout above. A version off
  # that tag scheme declares image / runtime_images itself instead.
  versions:
    "v0.5.4": {}
    "v0.5.3": {}
    "v0.5.2": {}
  components:
    # Peer discovery for P2P: cache servers register with it and poll it
    # for peers. It holds no cache and no GPU — an in-memory registry,
    # which is why upstream runs exactly one (its own operator says more
    # replicas only help behind a shared durable backend, and none
    # exists). Servers keep serving when it is unreachable; they lose
    # their peers and fall back to local L1 plus static L2.
    coordinator:
      enabled_by: enable_p2p
      gpu_access: false
      run_command: "lmcache coordinator --host {{host}} --port {{port}}"
      health_check:
        scheme: http
        path: /instances
    # The cache server engines attach to, one per worker. Its ZMQ port is
    # what peers dial for P2P control, so it binds every interface; the
    # transfer channel's handshake listener takes a port of its own, and
    # the address it advertises has to be the worker's routable one.
    # --l1-align-bytes is fixed rather than offered: peers must agree on
    # it and upstream does not check that they do. With P2P off the two
    # P2P flags render empty and drop, leaving the node-local server
    # this provider has always run.
    server:
      topology: per_node
      attach_endpoint: true
      serves_metrics: true
      depends_on: coordinator
      ports:
        - name: p2p
          enabled_by: enable_p2p
          enabled_when: true
      resource_profile:
        ram_gib: "{{ram_size}}"
        cpu: 2
      run_command: >-
        lmcache server --host {{host}} --port {{port}}
        --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}}
        --http-host {{host}} --http-port {{metrics_port}}
        --supported-transfer-mode auto --worker-reap-timeout-seconds 60
        --eviction-policy {{eviction_policy}}
        --eviction-trigger-watermark {{eviction_trigger_watermark}}
        --eviction-ratio {{eviction_ratio}} --l1-align-bytes 65536
        --coordinator-url {{component.coordinator.address}}
        --p2p-advertise-url {{ports.p2p.url}}
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
    # The server attaches to the node's GPUs to open CUDA IPC handles into
    # the engines' KV buffers; budget ~0.5-1 GiB VRAM per GPU for its CUDA
    # context (not modeled by the scheduler — leave that headroom free).
  # L2 storage: the MP server takes one flag whose value is a JSON object
  # of the form {"type": <backend key>, ...backend-specific fields}.
  # Fields with env_name are read by the server from that env var when
  # absent from the JSON, keeping credentials off the command line.
  # Eviction knobs promoted to structured advanced fields, wired into
  # the run command via their {{name}} placeholders; values and defaults
  # follow the v0.5.2 storage-manager argument group. The eviction
  # policy is required upstream, so its default always renders.
  managed_fields:
    - name: ram_size
      label: RAM Size (GiB)
      description: Cache capacity held in the cache server's memory.
      type: number
      required: true
      default: 20
      min: 1
      step: 1
    - name: chunk_size
      label: Chunk Size
      description: >-
        Tokens per KV cache chunk. Smaller chunks reuse at finer
        granularity but cost more overhead; empty uses the engine
        default.
      type: number
      min: 1
      step: 1
    - name: eviction_policy
      label: Eviction Policy
      default: LRU
      options: [LRU, IsolatedLRU, noop]
      description: >-
        LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
        list per cache salt and requires per-salt quotas via the HTTP
        API. noop never evicts.
    - name: eviction_trigger_watermark
      label: Eviction Trigger Watermark
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description: Memory usage fraction (0-1) that triggers eviction.
    - name: eviction_ratio
      label: Eviction Ratio
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description: Fraction of memory (0-1) evicted per trigger.
    # Peer-to-peer reads: a server that misses locally pulls the chunk
    # from a peer's cache over the transfer channel, so a deployment sees
    # the fleet's pool rather than its node's. Off by default — it needs
    # the coordinator process and one-sided RDMA through nixl.
    - name: enable_p2p
      label: Peer-to-Peer Reads
      description: >-
        Let each cache server read chunks from its peers instead of
        recomputing them, turning the per-node caches into one pool.
        Runs a coordinator process for peer discovery.
      type: boolean
      default: false
  l2_adapter_flag: "--l2-adapter"
  l2_backends:
    fs_native:
      display_name: Local Filesystem
      description: >-
        Spills KV cache to a local directory (e.g. NVMe) on the worker.
        max_capacity_gb caps disk usage; 0 or unset means uncapped.
      fields:
        # Defaults into the platform data dir: on containerized workers
        # the mirrored deployment carries the worker's /var/lib/gpustack
        # host mount into the cache container, so spilled cache lands on
        # host disk and survives container recreation.
        - name: base_path
          label: Base Path
          required: true
          default: /var/lib/gpustack/cache/lmcache/l2
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
        - { name: num_workers, label: I/O Workers, type: number }
        - { name: use_odirect, label: Direct I/O (O_DIRECT), type: boolean }
    resp:
      display_name: Redis / Valkey
      icon: /static/catalog_icons/redis.svg
      description: Shared L2 in a Redis or Valkey server; cache survives cache-server restarts.
      fields:
        - { name: host, label: Host, required: true }
        - { name: port, label: Port, type: number, required: true }
        - { name: username, label: Username, env_name: LMCACHE_RESP_USERNAME }
        - name: password
          label: Password
          type: password
          env_name: LMCACHE_RESP_PASSWORD
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
    s3:
      display_name: S3
      icon: /static/catalog_icons/s3.svg
      description: >-
        Shared L2 in an S3-compatible object store (AWS S3, MinIO, Ceph
        RGW). The endpoint uses virtual-hosted style — the bucket name is
        part of the host, e.g. "kvcache.s3.example.com"; path-style
        addressing is not supported. max_capacity_gb caps aggregate
        usage; 0 or unset means uncapped.
      fields:
        - { name: s3_endpoint, label: Bucket Endpoint, required: true }
        - { name: s3_region, label: Region, required: true }
        - { name: aws_access_key_id, label: Access Key ID, env_name: AWS_ACCESS_KEY_ID }
        - name: aws_secret_access_key
          label: Secret Access Key
          type: password
          env_name: AWS_SECRET_ACCESS_KEY
        - { name: disable_tls, label: Disable TLS (HTTP Endpoint), type: boolean }
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
  # Completion hints for the extra-parameters editor. Deliberately
  # excludes the flags GPUStack always renders from structured config.
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), valid again now that the
    # run command uses `lmcache server` instead of the module entry.
    - --coordinator-url
    - --p2p-advertise-url
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  # /healthcheck verifies the engine is initialized (503 until then) —
  # a stronger signal than a TCP connect on the ZMQ port. It lives on
  # the HTTP frontend, which is the metrics port in our port model.
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  # Metric names follow the LMCache MP observability docs
  # (https://docs.lmcache.ai/mp/observability.html). The mappings feed
  # the cache-service metrics endpoint backing the UI charts.
  # This block is the all-version default; a version that renames
  # metrics (the _GB_per_second suffix is an OTel exporter artifact and
  # a likely candidate) declares its own metrics block, which overrides
  # this one whole for services pinned to it.
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    # The MP server speaks ZMQ: clients attach through the MP connector
    # pointed at tcp://host:port (the server's --port), and the connector
    # requires the non-hybrid KV cache manager. Engines attach node-local
    # only (the per_node resolver degrades instead of crossing nodes:
    # the engine-driven copy path measures slower than no cache at all),
    # so the placement fact always renders {{mp_transfer_mode}} "auto" —
    # the CUDA-IPC zero-copy path, both containers sharing the host IPC
    # namespace, with host-copy fallback on CPU-only workers.
    # Scoped to the accelerators the connector is validated on — the
    # catalog is the single accelerator gate: on other frameworks the
    # resolver finds no integration and the instance starts degraded
    # with an explicit reason (no half-injection on the worker).
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          # The MP token hasher falls back to Python's builtin hash when
          # vLLM's hash function cannot be loaded; without a pinned seed
          # every engine process hashes chunks differently and
          # cross-instance sharing silently never hits.
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          - "--disable-hybrid-kv-cache-manager"
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # SGLang attaches through --enable-lmcache with a YAML config file
    # carrying the MP server address (the adapter pulls the chunk size
    # from the server itself). Its MP connector shares KV via CUDA IPC
    # with no cross-node fallback, so a SGLang deployment needs a cache
    # instance on its own worker — the per_node topology provides one
    # unless the worker selector excludes that node.
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          # Same builtin-hash fallback guard as the vLLM side.
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
- name: Mooncake
  display_name: Mooncake
  source: built_in
  icon: /static/catalog_icons/mooncake.png
  description: >-
    Mooncake Store is a distributed KV cache pool: a lightweight master
    coordinates it, and capacity comes from the engines themselves
    (embedded mode — each GPU contributes host DRAM) or from dedicated
    store replicas (standalone-store mode, which keeps the cache
    independent of engine restarts). Any engine in the cluster attaches
    over TCP/RDMA.
  links:
    - { label: Documentation, url: "https://kvcache-ai.github.io/Mooncake/" }
    - { label: GitHub, url: "https://github.com/kvcache-ai/Mooncake" }
  # Provider-specific Grafana dashboard provisioned from
  # docker-compose/grafana/grafana_dashboards/gpustack-mooncake.json,
  # built on the master's pool/keys/eviction/request metrics.
  dashboard_uid: gpustack-mooncake
  supported_modes: [managed]
  # The vLLM runner images bundle the mooncake wheel, so the cache
  # containers and the engines share one wheel source — Mooncake's RPC
  # wire format breaks across builds, and same-image sourcing is what
  # keeps client and master compatible. Version = the bundled wheel.
  # The label matches the CUDA runner's wheel string only, and a wheel
  # string does not identify a build: that wheel is
  # mooncake-transfer-engine 0.3.10.post2 built from commit 0da9dfea3,
  # which already holds post-0.3.10 HA code (hence the master's
  # supervisor states). The CANN runner carries a different package
  # altogether, mooncake-transfer-engine-npu 0.3.11.post1. Since the
  # wire format is build-exact, read the label as "whatever the runner
  # bundles", never as a pairing guarantee across accelerators.
  default_version: v0.3.10.post2
  custom_version: true
  versions:
    "v0.3.10.post2":
      # CPU-only workers run master/store from the plain image (a store
      # on a RAM-rich CPU node is a supported shape).
      image: gpustack/runner:cuda12.9-vllm0.27.1
      runtime_images:
        cuda:
          "12": gpustack/runner:cuda12.9-vllm0.27.1
          "13": gpustack/runner:cuda13.0-vllm0.27.1
        cann:
          "9": gpustack/runner:cann9.1-910b-vllm0.23.0
        # The wire format is build-exact, and these runners carry
        # different engine releases, so one service must not span GPU and
        # NPU workers: scope it with the worker selector. The master
        # takes no accelerator and runs from the plain image anywhere.
  components:
    # The coordinator: metadata only, no cache capacity, no GPU. Flag
    # values follow the vllm-project/recipes curated Mooncake configs
    # (30s KV lease; eviction starts at 95% pool usage, frees 10% per
    # pass). Flags verified against the source the CUDA runner's wheel
    # was built from: rpc_port supersedes the deprecated port, the
    # metrics HTTP server binds all interfaces on its own (no
    # metrics_host flag exists), and the HA endpoints ride
    # etcd_endpoints, the name v0.3.13 keeps as the legacy alias.
    # What HA delivers on the bundled build, measured: clients resolve
    # the master through etcd, so a master that dies and is recreated is
    # picked up on its own — no dependent recreation, no engine restart,
    # which is what a stamped address costs. What it does not deliver is
    # a standby taking over: the standbys loop candidate -> standby ->
    # await view change every second, and each pass logs a failed
    # replication start because it reads an oplog key the leader never
    # initialises. That failure latches (standby_running_ stays false),
    # and promotion refuses while it is, so a surviving standby wins the
    # lease and hands it straight back; recovery comes from the fresh
    # master instead, which has observed no leader and so can promote.
    # Upstream is reworking oplog durability, which is where this gets
    # fixed.
    master:
      attach_endpoint: true
      serves_metrics: true
      gpu_access: false
      replicas_by: master_replicas
      # The leader writes this address into the coordination backend and
      # clients dial it directly, so it must be the worker's routable
      # address rather than the bind-any default. The metrics port serves
      # every interface regardless, so the health probe is unaffected.
      run_command: >-
        mooncake_master --rpc_address {{worker_ip}} --rpc_port {{port}}
        --metrics_port {{metrics_port}}
        --default_kv_lease_ttl 30000
        --eviction_high_watermark_ratio {{eviction_high_watermark_ratio}}
        --eviction_ratio {{eviction_ratio}}
        --enable_ha={{enable_ha}} --etcd_endpoints {{etcd_endpoints}}
        --cluster_id gpustack-cache-service-{{service_id}}
      # With HA on, clients discover the current leader through etcd
      # instead of dialing one master; without endpoints this renders to
      # nothing and the resolved instance address is used.
      address_template: "etcd://{{etcd_endpoints}}"
      health_check:
        scheme: http
        path: /metrics
        target: metrics
    # Dedicated pool capacity, present only in standalone-store mode.
    # Configured purely through env (MooncakeConfig.load_from_env);
    # local_hostname must be the worker's reachable IP — the P2P
    # handshake advertises it to peers, where the bind-any address
    # would be useless.
    store:
      topology: replicas
      replicas_by: store_replicas
      depends_on: master
      # per-replica claim the form's placement pre-flight checks
      resource_profile:
        ram_gib: "{{store_segment_size}}"
      enabled_by: pool_mode
      enabled_when: standalone-store
      gpu_access: false
      run_command: >-
        python3 -m mooncake.mooncake_store_service --port {{port}}
      env:
        MOONCAKE_MASTER: "{{component.master.address}}"
        MC_STORE_CLUSTER_ID: "gpustack-cache-service-{{service_id}}"
        MOONCAKE_TE_META_DATA_SERVER: P2PHANDSHAKE
        MOONCAKE_LOCAL_HOSTNAME: "{{worker_ip}}"
        MOONCAKE_PROTOCOL: "{{protocol}}"
        MOONCAKE_DEVICE: "{{device_name}}"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: "{{store_segment_size}}gb"
        MOONCAKE_LOCAL_BUFFER_SIZE: "4gb"
  # Field names keep the component scope (engine_ / store_) for template
  # readability; the labels speak Mooncake's own vocabulary (mode,
  # global_segment_size), and the mode-scoped pair renders one at a time.
  managed_fields:
    - name: pool_mode
      label: Mode
      description: Where the pool's memory comes from.
      default: embedded
      options:
        - value: embedded
          label: Embedded
          description: >-
            Each engine GPU contributes host DRAM — simplest, no extra
            processes.
        - value: standalone-store
          label: Standalone Store
          description: >-
            Dedicated store replicas own the pool: the cache survives
            engine restarts, and CPU RAM-rich nodes can serve it.
    - name: engine_segment_size
      label: Global Segment Size (GiB)
      description: >-
        Host DRAM each engine GPU registers to the pool (per GPU, not
        per node); size it so the total across a node's GPUs fits in
        host RAM.
      type: number
      default: 20
      min: 0
      step: 1
      visible_by: pool_mode
      visible_when: embedded
      # a standalone store owns the pool; the connector rejects any
      # engine contribution, so the hidden field must render 0
      gated_default: 0
    - name: store_replicas
      label: Store Replicas
      description: >-
        How many store replicas form the pool, spread across the
        matching workers.
      type: number
      default: 1
      min: 1
      step: 1
      visible_by: pool_mode
      visible_when: standalone-store
    - name: store_segment_size
      label: Global Segment Size (GiB)
      description: >-
        DRAM each store replica registers to the pool (per replica);
        size it to its worker's available RAM.
      type: number
      default: 40
      min: 1
      step: 1
      visible_by: pool_mode
      visible_when: standalone-store
    - name: protocol
      label: Transport Protocol
      description: >-
        RDMA for production performance on GPU nodes, Ascend for NPU
        nodes (CANN's ADXL, itself over HCCS or RDMA), TCP for functional
        setups. Every worker of the service transfers over the one
        protocol, so a service spanning GPU and NPU nodes has to stay on
        TCP.
      default: tcp
      options:
        - { value: tcp, label: TCP }
        - { value: rdma, label: RDMA }
        - { value: ascend, label: Ascend }
    - name: device_name
      label: RDMA Device
      description: NIC device(s) for the RDMA protocol.
      placeholder: "mlx5_0"
      visible_by: protocol
      visible_when: rdma
    # Recipes-curated eviction posture, exposed like LMCache's knobs:
    # start evicting at 95% pool usage, free 10% per pass.
    - name: eviction_high_watermark_ratio
      label: Eviction High Watermark
      description: Pool usage fraction at which eviction starts.
      type: number
      default: 0.95
      min: 0.5
      max: 1
      step: 0.05
    - name: eviction_ratio
      label: Eviction Ratio
      description: Fraction of the pool freed per eviction pass.
      type: number
      default: 0.1
      min: 0.05
      max: 1
      step: 0.05
    - name: enable_ha
      label: High Availability
      description: >-
        Run several masters that elect a leader through etcd, so the pool
        survives losing one; clients discover the current leader
        themselves. Needs an etcd you provide — the platform does not run
        one.
      type: boolean
      default: false
    # Named after the flag that carries it. v0.3.13 renames the pair to
    # ha_backend_type/ha_backend_connstring to admit other backends, so
    # moving the default version past v0.3.10 has to re-cut this command
    # — which today needs per-version component launches, a gap the
    # catalog does not cover yet.
    - name: etcd_endpoints
      label: etcd Endpoints
      description: >-
        host:port of your etcd, comma-separated for several. The masters
        elect through it and engines read the current leader from it.
      placeholder: "10.0.0.1:2379,10.0.0.2:2379"
      required: true
      visible_by: enable_ha
      visible_when: true
    - name: master_replicas
      label: Master Replicas
      description: >-
        Masters in the election. One leader serves at a time; the
        others stand by to take over. They do not vote among themselves —
        etcd holds the election — so two already survives losing one, and
        more only buys depth; size this by how many workers can hold a
        master.
      type: number
      default: 2
      min: 2
      step: 1
      visible_by: enable_ha
      visible_when: true
      # One master without HA: there is nothing to elect against.
      gated_default: 1
  health_check:
    scheme: tcp
  # The master serves Prometheus text on its metrics port (GET /metrics,
  # enable_metric_reporting defaults to true). Metric names follow
  # mooncake-store's master_metric_manager. Lookup-hit accounting lives
  # in the engine-side connector, not the master, so there is no
  # hit_rate mapping; usage is the pool's allocated-vs-capacity view.
  default_metrics:
    path: /metrics
    mappings:
      l1_usage_bytes:
        gauge: master_allocated_bytes
      l1_usage_ratio:
        gauge_ratio:
          numerator: master_allocated_bytes
          denominator: master_total_capacity_bytes
  inference_backend_integrations:
    # MooncakeStoreConnector uses the Mooncake distributed store as a
    # shared KV pool. The connector reads its configuration solely from
    # the JSON file MOONCAKE_CONFIG_PATH points at (no per-field env
    # support), so the injection writes that file into the engine
    # container. The mode and the engine's contribution follow the
    # service's pool_mode: embedded engines register
    # engine_segment_size per GPU, standalone-store engines are pure
    # requesters (the connector enforces zero contribution in that
    # mode). The mode field is recent in vLLM; behavior on older
    # connectors is a calibration surface for integration testing.
    - backend: vLLM
      frameworks: [cuda, cann]
      versions: ">=0.9.0"
      injection:
        env:
          MOONCAKE_CONFIG_PATH: /tmp/gpustack-mooncake.json
          # Masters publish the elected leader under a keyspace named
          # after the service, so every client of that service has to
          # look in the same place. Upstream disagrees with itself on
          # the default — the master's --cluster_id falls back to
          # "mooncake_cluster" while a client with no env falls back to
          # "mooncake" — so naming it explicitly is what makes them
          # meet, and it keeps two services sharing one etcd apart.
          MC_STORE_CLUSTER_ID: "gpustack-cache-service-{{service_id}}"
          # The MP-style chunk hashes must agree across engine processes;
          # a random per-process hash seed would silently break sharing
          # (the recipes set the same).
          PYTHONHASHSEED: "0"
          # The TCP transport opens a fresh connection per transfer slice
          # by default; under prefill bursts the client-side TIME_WAIT
          # backlog exhausts ephemeral ports (connect() fails with
          # EADDRNOTAVAIL). Pooling is the sane default for LLM traffic;
          # the RDMA path never reads this switch.
          MC_TCP_ENABLE_CONNECTION_POOL: "1"
        files:
          /tmp/gpustack-mooncake.json: |
            {
              "mode": "{{pool_mode}}",
              "metadata_server": "P2PHANDSHAKE",
              "master_server_address": "{{master_server_address}}",
              "global_segment_size": "{{engine_segment_size}}GB",
              "local_buffer_size": "4GB",
              "protocol": "{{protocol}}",
              "device_name": "{{device_name}}"
            }
        kv_transfer_config:
          kv_connector: MooncakeStoreConnector
          kv_role: kv_both
# PLACEHOLDER. Change as needed.
- name: XSKY MeshFusion
  display_name: XSKY MeshFusion
  source: partner
  icon: /static/catalog_icons/xsky.png
  description: >-
    XSKY MeshFusion is a KV cache layer for LLM serving. As a shared cache
    service it runs a cache server on every worker; deployments and replicas
    on the same node share KV cache through it, and a shared L2 storage
    backend (e.g. XSKY's store) extends the reuse across nodes.
  links:
    - { label: Product Page, url: "https://www.xsky.com" }
  supported_modes: [managed]
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  default_version: "v0.5.2"
  custom_version: true
  default_run_args: "--host {{host}} --port {{port}} --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}} --http-host {{host}} --http-port {{metrics_port}} --supported-transfer-mode auto --worker-reap-timeout-seconds 60 --eviction-policy {{eviction_policy}} --eviction-trigger-watermark {{eviction_trigger_watermark}} --eviction-ratio {{eviction_ratio}}"
  default_image: "lmcache/vllm-openai:{{version}}"
  default_runtime_images:
    cuda:
      "13": "lmcache/vllm-openai:{{version}}"
      "12": "lmcache/vllm-openai:{{version}}-cu129"
    # PLACEHOLDER. Change as needed.
    cann:
      "8": "registry.example.com/lmcache/vllm-openai:{{version}}-cann"
  versions:
    "v0.5.2": {}
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
  managed_fields:
    - name: ram_size
      label: RAM Size (GiB)
      description: Cache capacity held in the cache server's memory.
      type: number
      required: true
      default: 20
      min: 1
      step: 1
    - name: chunk_size
      label: Chunk Size
      description: >-
        Tokens per KV cache chunk. Smaller chunks reuse at finer
        granularity but cost more overhead; empty uses the engine
        default.
      type: number
      min: 1
      step: 1
    - name: eviction_policy
      label: Eviction Policy
      default: LRU
      options: [LRU, IsolatedLRU, noop]
      description: >-
        LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
        list per cache salt and requires per-salt quotas via the HTTP
        API. noop never evicts.
    - name: eviction_trigger_watermark
      label: Eviction Trigger Watermark
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description: Memory usage fraction (0-1) that triggers eviction.
    - name: eviction_ratio
      label: Eviction Ratio
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description: Fraction of memory (0-1) evicted per trigger.
  l2_adapter_flag: "--l2-adapter"
  l2_backends:
    fs_native:
      display_name: Local Filesystem
      description: >-
        Spills KV cache to a local directory (e.g. NVMe) on the worker.
        max_capacity_gb caps disk usage; 0 or unset means uncapped.
      fields:
        # Defaults into the platform data dir: on containerized workers
        # the mirrored deployment carries the worker's /var/lib/gpustack
        # host mount into the cache container, so spilled cache lands on
        # host disk and survives container recreation.
        - name: base_path
          label: Base Path
          required: true
          default: /var/lib/gpustack/cache/lmcache/l2
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
        - { name: num_workers, label: I/O Workers, type: number }
        - { name: use_odirect, label: Direct I/O (O_DIRECT), type: boolean }
    xdfs:
      display_name: XSKY MeshFusion Store
      icon: /static/catalog_icons/xsky.png
      description: >-
        XSKY MeshFusion Store distributed storage as the L2 tier; capacity
        and durability scale with the external storage cluster.
      fields:
        - { name: metadata_endpoint, label: Metadata Endpoint, required: true }
        - { name: sdk_config_file, label: SDK Config File, default: /opt/meshfusion/sdk.flags }
        - { name: num_workers, label: Workers, type: number, default: 32 }
        - { name: io_depth, label: IO Depth, type: number, default: 256 }
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number, default: 30720 }
        - { name: policy_id, label: Policy ID, type: number, default: 1 }
        - { name: timeout_ms, label: Timeout (ms), type: number, default: 60000 }
        - { name: tenant_id, label: Tenant ID, default: nixl }
        - { name: max_write_inflight_bytes, label: Max Write Inflight (Bytes), type: number, default: 536870912 }
    resp:
      display_name: Redis / Valkey
      icon: /static/catalog_icons/redis.svg
      description: Shared L2 in a Redis or Valkey server; cache survives cache-server restarts.
      fields:
        - { name: host, label: Host, required: true }
        - { name: port, label: Port, type: number, required: true }
        - { name: username, label: Username, env_name: LMCACHE_RESP_USERNAME }
        - name: password
          label: Password
          type: password
          env_name: LMCACHE_RESP_PASSWORD
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
    s3:
      display_name: S3
      icon: /static/catalog_icons/s3.svg
      description: >-
        Shared L2 in an S3-compatible object store (AWS S3, MinIO, Ceph
        RGW). The endpoint uses virtual-hosted style — the bucket name is
        part of the host, e.g. "kvcache.s3.example.com"; path-style
        addressing is not supported. max_capacity_gb caps aggregate
        usage; 0 or unset means uncapped.
      fields:
        - { name: s3_endpoint, label: Bucket Endpoint, required: true }
        - { name: s3_region, label: Region, required: true }
        - { name: aws_access_key_id, label: Access Key ID, env_name: AWS_ACCESS_KEY_ID }
        - name: aws_secret_access_key
          label: Secret Access Key
          type: password
          env_name: AWS_SECRET_ACCESS_KEY
        - { name: disable_tls, label: Disable TLS (HTTP Endpoint), type: boolean }
        - { name: max_capacity_gb, label: Max Capacity (GiB), type: number }
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), valid again now that the
    # run command uses `lmcache server` instead of the module entry.
    - --coordinator-url
    - --p2p-advertise-url
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          - "--disable-hybrid-kv-cache-manager"
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # PLACEHOLDER. Change as needed.
    - backend: vLLM
      frameworks: [cann]
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          - "--disable-hybrid-kv-cache-manager"
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
