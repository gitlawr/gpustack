[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Marker definitions
markers =
    # GPU types
    nvidia: Requires NVIDIA GPU
    amd: Requires AMD GPU
    ascend: Requires Huawei Ascend NPU
    wsl: Windows WSL environment
    cpu_only: CPU only
    
    # Deployment modes
    allinone: All-in-one deployment
    server_only: Server-only deployment
    distributed: Distributed deployment
    
    # Feature categories
    installation: Installation and deployment tests
    model: Model deployment tests
    worker: Worker management tests
    upgrade: Upgrade tests
    provider: Provider tests
    route: Route tests
    stability: Stability tests
    multimodal: Multimodal tests (TTS/ASR/Image)
    benchmark: Benchmark tests
    monitoring: Monitoring tests
    
    # Inference backends
    vllm: vLLM backend
    sglang: SGLang backend
    mindie: MindIE backend (Ascend)
    gguf: GGUF/llama.cpp backend
    custom_backend: Custom inference backend
    
    # Worker types
    do_worker: DigitalOcean worker
    k8s_worker: Kubernetes worker
    
    # Priority
    smoke: Smoke tests (core functionality)
    regression: Regression tests (full)
    slow: Slow running tests

filterwarnings =
    ignore::DeprecationWarning:google.protobuf
    ignore::DeprecationWarning:websockets
    ignore::DeprecationWarning:uvicorn
    ignore::DeprecationWarning:httpx

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout configuration (requires pytest-timeout plugin)
# timeout = 1800
