      distilled: true
  feature_tiles:
  - id: spec_decoding:mtp
    label: spec_decoding (mtp)
    description: Multi-Token Prediction speculative decoding (up to 7 draft tokens)
    backends:
    - vLLM
    flags:
    - --speculative-config={"method":"mtp","num_speculative_tokens":5}
    default_on: false
  - id: spec_decoding:dspark
    label: spec_decoding (dspark)
    description: Multi-Token Prediction speculative decoding (up to 7 draft tokens)
    backends:
    - vLLM
    flags:
    - '--speculative-config={"model": "RedHatAI/GLM-5.2-speculator.dspark","num_speculative_tokens": 7,"method":
      "dspark"}'
    default_on: false
  - id: deepep
    label: DeepEP
    backends:
    - SGLang
    flags:
    - --moe-a2a-backend=deepep
    default_on: false
  - id: mtp-516
    label: EAGLE / MTP 5-1-6 (low-latency)
    backends:
    - SGLang
    flags:
    - --speculative-algorithm=EAGLE
    - --speculative-num-steps=5
    - --speculative-eagle-topk=1
    - --speculative-num-draft-tokens=6
    default_on: false
    disable_by_hw:
    - hw:
      - mi355x
      - mi325x
      - mi300x
      reason: ''
  - id: mtp-112
    label: EAGLE / MTP 1-1-2 (balanced)
    backends:
    - SGLang
    flags:
    - --speculative-algorithm=EAGLE
    - --speculative-num-steps=1
    - --speculative-eagle-topk=1
    - --speculative-num-draft-tokens=2
    default_on: false
    disable_by_hw:
    - hw:
      - mi355x
      - mi325x
      - mi300x
      reason: ''

